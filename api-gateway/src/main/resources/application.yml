server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**

        - id: asset-service
          uri: ${ASSET_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/assets/**

        - id: maintenance-service
          uri: ${MAINTENANCE_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/maintenance/**
